name: 构建 userscript

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          # 隐私检查需要审计完整 commit 历史。
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 代码检查
        run: bun run check

      - name: 构建 userscript
        run: bun run build

      - name: 确认提交的构建产物是最新的
        run: git diff --exit-code -- dist/shantie.user.js

      - name: 确认 tag 与 userscript 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -Fq "@version      ${GITHUB_REF_NAME#v}" dist/shantie.user.js

      - name: 上传 userscript 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: shantie-userscript
          path: dist/shantie.user.js
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已验证的 userscript
        uses: actions/download-artifact@v8
        with:
          name: shantie-userscript
          path: release

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/shantie.user.js
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
